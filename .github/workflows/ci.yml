name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Process spawning, signals and the compiled binary differ between Linux and macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun run install:ci
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:hooks
      - run: bun run coverage
      - run: bun run e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            packages/**/coverage/
            packages/**/logs/
  # The one required check: green only when every matrix job passed.
  ci-ok:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
