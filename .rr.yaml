# Road Runner: `rr <task>` runs a task on the first free test host, under a per-host lock, so
# parallel agents and delegates queue their test runs instead of starving each other's. Hosts come
# from each maintainer's ~/.rr/config.yaml; see https://github.com/rileyhilliard/rr and AGENTS.md
# "Test runs".

version: 1

# Fastest first, since a task takes the first free host in this order. `mbp` is the dev machine
# itself (`local: true` in ~/.rr/config.yaml): it runs in place in the checkout or worktree rr is
# run from, with nothing synced, under the same lock. Then m4-mini (16 GB, 10 cores) and m1-mini
# (8 GB), which other projects share, so one heavy suite runs per host at a time. A machine whose
# global config has no `mbp` host adds its own local host under that name.
#
# Measured 2026-10-27, seconds from rr's details.exec_duration_s (no sync or lock wait):
# Host       CLI+install #1  CLI+install #2  bench.test.ts
# mbp                 37.25           36.35          13.13
# m4-mini             33.84           32.49          26.52
# m1-mini             52.65           54.12          35.12
# CLI excludes tests/bench.test.ts; both CLI runs include bun install --frozen-lockfile.
# m1-mini is slower on both partitions, supporting the CLI pins to [mbp, m4-mini].
# Every task except the light ones is pinned to `hosts: [mbp, m4-mini]`, and rr only picks a pinned
# host for it. A new task needs a pin too, or it can land on an m1. m1-linux (aarch64 Linux, as
# CI's ubuntu job) is a production serving box: keep it to the light partitions.
hosts:
  - mbp
  - m4-mini
  - m1-mini
  - m1-linux

# Never fall back to an unlocked local run: one that exits 0 reads like a queued run. To run here
# on purpose, use `bun run ...` directly.
local_fallback: false

# Checked in the host's environment before the sync, so a host without them fails fast.
require: [bun, node, git]

# The hosts' default node isn't .node-version's major, so the pinned major goes first on PATH, as
# CI does: Homebrew's keg-only node@24 (`brew install node@24`) on the minis, and the official
# tarball unpacked into ~/.local/node24 on m1-linux. Each is a no-op where it doesn't exist.
defaults:
  setup:
    - export PATH="/opt/homebrew/opt/node@24/bin:$HOME/.local/node24/bin:$PATH"

sync:
  # Every worktree shares one remote copy per host (~/rr/quickstack) instead of one each, so copies
  # don't pile up on the hosts, rsync sends only the diff when another worktree syncs, and
  # node_modules stays warm. The per-host lock covers the sync and the run, so runs can't overlap.
  worktree_isolation: false

  # Replaces rr's defaults, so they're repeated here; .gitignore applies on top (dist/, coverage/,
  # logs/, .dev/).
  exclude:
    # Bare patterns: in a worktree .git is a file and node_modules can be a symlink.
    - .git
    - node_modules
    # .claude/ itself syncs: tests/hooks/ runs the hooks against it.
    - .claude/settings.local.json
    - .claude/hooks/private-patterns.local
    - .claude/worktrees/
    - .DS_Store
    - "*.log"
    - .env

  preserve:
    - node_modules/

  flags:
    - --delete

lock:
  enabled: true
  # Several agents can be queued behind one run.
  timeout: 30m
  wait_timeout: 30m
  stale: 10m

tasks:
  # The gate (`bun run check`) as partitions that hosts pull as they free up, longest first. A host
  # runs one partition at a time and Vitest already uses every core, so the CLI suite is split only
  # where it helps: bench.test.ts is latency-bound (its own maxConcurrency) and as long as the rest
  # of the suite together, so the two run side by side on the fast hosts.
  check:
    description: The full gate (lint, typecheck, root and CLI tests, e2e), partitioned across hosts
    setup: bun install --frozen-lockfile
    parallel:
      [check-bench, check-cli, check-e2e, check-format, check-hooks, check-mcp, check-static]
    fail_fast: false

  check-bench:
    hosts: [mbp, m4-mini]
    run: cd packages/cli && bun run test:unit tests/bench.test.ts
  # The CLI suite takes m4-mini first: it is as fast as mbp idle, and mbp also runs the agents and
  # delegates, under which the 37 s suite has taken six minutes. bench.test.ts is latency-bound,
  # so it keeps mbp.
  check-cli:
    hosts: [m4-mini, mbp]
    run: cd packages/cli && bun run test:unit --exclude tests/bench.test.ts
  # The rest go to the m1 hosts, so the fast ones start the two CLI partitions at once.
  check-e2e:
    hosts: [m1-mini, m1-linux]
    run: bun run e2e
  check-format:
    hosts: [m1-mini, m1-linux]
    run: cd packages/format && bun run test
  check-hooks:
    hosts: [m1-mini, m1-linux]
    run: bun run test:hooks
  check-mcp:
    hosts: [m1-mini, m1-linux]
    run: cd packages/mcp && bun run test
  check-static:
    hosts: [m1-mini, m1-linux]
    run: bun run lint && bun run typecheck

  check-serial:
    description: The full gate on one host, in order, as CI runs it
    hosts: [mbp, m4-mini]
    run: bun install --frozen-lockfile && bun run check

  test:
    description: Root tests then every package's tests
    hosts: [mbp, m4-mini]
    run: bun install --frozen-lockfile && bun run test

  test-cli:
    description: CLI Vitest tests (pass files or -- -t "<name>" to narrow)
    hosts: [mbp, m4-mini]
    run: bun install --frozen-lockfile && cd packages/cli && bun run test:unit {args}

  test-hooks:
    description: Root tests only (hooks and delegate runner)
    run: bun install --frozen-lockfile && bun run test:hooks {args}

  e2e:
    description: Compile the CLI and run the binary e2e tests
    run: bun install --frozen-lockfile && bun run e2e
