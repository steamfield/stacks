name: app
publish_to: none

# Setup copies `version:` and `environment:` from a fresh `flutter create` and adds
# the packages with `flutter pub add`, so each one resolves to its current
# release. The SDK packages below carry no version.

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
