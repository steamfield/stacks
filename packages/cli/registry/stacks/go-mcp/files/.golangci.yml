version: "2"

run:
  build-tags: [integration]

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - gosec
    - revive
    - nolintlint
    - forbidigo
  settings:
    # On the stdio transport stdout carries only JSON-RPC messages; one stray
    # print corrupts the stream and the host drops the server.
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: stdout belongs to the MCP transport. Log with the injected *slog.Logger (stderr).
        - pattern: ^os\.Stdout$
          msg: stdout belongs to the MCP transport. Log with the injected *slog.Logger (stderr).
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: Use the injected *slog.Logger; return errors to main instead of exiting.
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks: [hugeParam, appendCombine, ifElseChain, wrapperFunc]
    gocyclo:
      min-complexity: 30
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - os.Setenv
        - os.Unsetenv
    # All gosec rules remain enabled; there are no global security exclusions.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: true # internal/errors intentionally has the standard library's name.
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    presets: []
    rules:
      - path: _test\.go$
        linters: [gocyclo, gosec, errcheck, unparam]
      # The development client prints results; it is never the server.
      - path: ^cmd/mcpcall/
        linters: [forbidigo]

formatters:
  enable: [gofmt, goimports]
  exclusions:
    generated: strict
