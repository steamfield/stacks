# SwiftLint checks code patterns; swift-format (.swift-format) owns layout. Rules that only
# restate layout are disabled here so the two tools never disagree.
included:
  - App
  - AppTests
  - AppUITests
excluded:
  - build
disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - fatal_error_message
  - private_swiftui_state
  - unowned_variable_capture
  - weak_delegate
line_length:
  warning: 120
  ignores_comments: true
identifier_name:
  excluded:
    - id
