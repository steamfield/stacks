<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
    <head>
        <title>Notes</title>
    </head>
    <body>
        <main>
            <h1>Notes</h1>
            <!--/*
              The `notes` fragment is what an htmx post gets back and swaps in place of
              itself. Without JavaScript the same form posts normally and the server
              redirects or re-renders the whole page.
            */-->
            <section id="notes" th:fragment="notes">
                <p class="saved" role="status" th:if="${saved}">Saved <strong th:text="${saved}">title</strong>.</p>
                <form class="card" method="post" novalidate
                      th:action="@{/notes}" th:hx-post="@{/notes}" hx-target="#notes" hx-swap="outerHTML"
                      th:object="${noteForm}">
                    <div class="field">
                        <label for="title">Title</label>
                        <input type="text" th:field="*{title}" th:errorclass="invalid">
                        <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</p>
                    </div>
                    <div class="field">
                        <label for="body">Note</label>
                        <textarea rows="4" th:field="*{body}" th:errorclass="invalid"></textarea>
                        <p class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}">Body error</p>
                    </div>
                    <button type="submit">Add note</button>
                </form>
                <ul class="notes">
                    <li th:each="note : ${notes}">
                        <a href="/notes/id" th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.title}">Title</a>
                    </li>
                    <li class="empty" th:if="${#lists.isEmpty(notes)}">No notes yet.</li>
                </ul>
            </section>
        </main>
    </body>
</html>
